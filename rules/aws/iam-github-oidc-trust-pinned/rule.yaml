id: iam-github-oidc-trust-pinned
name: GitHub OIDC role trust is pinned to a repository
description: Every IAM role trust statement that lets the GitHub Actions OIDC provider assume the role must require aud sts.amazonaws.com and a sub that names a specific owner and repository.
severity: CRITICAL
target_native_types: [role]
nist_800_53: [AC-3, AC-6, IA-8]
remediation: |
  Pin the trust policy to one repository and, ideally, one branch or environment.

  ```hcl
  data "aws_partition" "current" {}
  data "aws_caller_identity" "current" {}

  data "aws_iam_policy_document" "github_trust" {
    statement {
      effect  = "Allow"
      actions = ["sts:AssumeRoleWithWebIdentity"]
      principals {
        type        = "Federated"
        identifiers = ["arn:${data.aws_partition.current.partition}:iam::${data.aws_caller_identity.current.account_id}:oidc-provider/token.actions.githubusercontent.com"]
      }
      condition {
        test     = "StringEquals"
        variable = "token.actions.githubusercontent.com:aud"
        values   = ["sts.amazonaws.com"]
      }
      condition {
        test     = "StringEquals"
        variable = "token.actions.githubusercontent.com:sub"
        values   = ["repo:<owner>/<repo>:ref:refs/heads/main"]
      }
    }
  }
  ```
