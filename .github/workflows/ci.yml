name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job only reads the repository.
permissions:
  contents: read

jobs:
  rego:
    name: Rego fmt, check and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OPA_VERSION: "1.21.2"
      OPA_SHA256: 830ab11f61ffec760b5e19db0d7ad02bf037e13f5ef4d665faeaf17632177527
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install OPA
        run: |
          curl -fsSLo opa "https://github.com/open-policy-agent/opa/releases/download/v${OPA_VERSION}/opa_linux_amd64_static"
          echo "${OPA_SHA256}  opa" | sha256sum -c -
          chmod +x opa
          sudo mv opa /usr/local/bin/opa
          opa version

      - name: Check rules
        run: ./scripts/check-rules.sh

  terraform:
    name: Terraform (${{ matrix.terraform }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The oldest version required_version allows, and the current one.
        terraform: ["1.9.8", "1.16.4"]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ matrix.terraform }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive

      # Plan-only tests with a mocked Wiz provider: no credentials, no API calls.
      - name: Module validate and test
        run: |
          terraform -chdir=terraform init -backend=false -input=false >/dev/null
          terraform -chdir=terraform validate
          terraform -chdir=terraform test

      - name: Example validate
        run: |
          terraform -chdir=examples/basic init -backend=false -input=false >/dev/null
          terraform -chdir=examples/basic validate
